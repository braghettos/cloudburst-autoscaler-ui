# CloudBurst UI CI
#
# Requires cloudburst-autoscaler as a sibling for Go build. CI clones it using
# REPO_ACCESS_TOKEN (required for private repos—GITHUB_TOKEN cannot access other
# private repos). Fallback to GITHUB_TOKEN for public autoscaler repos.
#
# For private repos, add:
#   Settings > Secrets > Actions > REPO_ACCESS_TOKEN = PAT with repo scope
#   Settings > Variables > AUTOSCALER_REPO = owner/cloudburst-autoscaler (if different org)

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UI_REPO: ${{ vars.UI_REPO != '' && vars.UI_REPO || format('{0}/cloudburst-autoscaler-ui', github.repository_owner) }}
  AUTOSCALER_REPO: ${{ vars.AUTOSCALER_REPO != '' && vars.AUTOSCALER_REPO || format('{0}/cloudburst-autoscaler', github.repository_owner) }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout cloudburst-autoscaler-ui
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UI_REPO }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: ${{ vars.NPM_AUDIT_CONTINUE_ON_ERROR == 'true' }}

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cloudburst-autoscaler-ui
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UI_REPO }}

      - name: Clone cloudburst-autoscaler
        uses: ./.github/actions/clone-autoscaler
        with:
          autoscaler_repo: ${{ env.AUTOSCALER_REPO }}
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [frontend, lint]
    steps:
      - name: Checkout cloudburst-autoscaler-ui
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UI_REPO }}

      - name: Clone cloudburst-autoscaler
        uses: ./.github/actions/clone-autoscaler
        with:
          autoscaler_repo: ${{ env.AUTOSCALER_REPO }}
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build
        run: make build

      - name: Verify binary
        run: file bin/cloudburst-ui

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout cloudburst-autoscaler-ui
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UI_REPO }}

      - name: Clone cloudburst-autoscaler
        uses: ./.github/actions/clone-autoscaler
        with:
          autoscaler_repo: ${{ env.AUTOSCALER_REPO }}
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr

      - name: Build image (no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ..
          file: cloudburst-autoscaler-ui/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ..
          file: cloudburst-autoscaler-ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout cloudburst-autoscaler-ui
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UI_REPO }}

      - name: Clone cloudburst-autoscaler
        uses: ./.github/actions/clone-autoscaler
        with:
          autoscaler_repo: ${{ env.AUTOSCALER_REPO }}
          token: ${{ secrets.REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          branch: main

      - name: Install Kind
        run: |
          curl -sLo kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Run UI E2E
        run: |
          cd ../cloudburst-autoscaler
          ./hack/integration-test-e2e-ui.sh
